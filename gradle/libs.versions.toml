[versions]
agp = "9.2.0"
# AGP 9 内置 Kotlin：默认 KGP 2.2.10，compose 编译器插件版本需与之一致
kotlin = "2.2.10"
ksp = "2.2.10-2.0.2"

composeBom = "2026.06.01"
coreKtx = "1.18.0"
# 注意：lifecycle 2.11.x 要求 minCompileSdk=37（本项目 36）。版本目录写死 2.10.0 不够 ——
# 传递依赖会带来 2.11.x，Gradle 取高版本，所以根构建里另有一段版本对齐（见 build.gradle.kts）。
lifecycle = "2.10.0"
activityCompose = "1.13.0"
navigationCompose = "2.9.0"
# 注意：navigation 2.10.x 要求 minCompileSdk=37，本项目 compileSdk=36（3e 第一次真正用到
# navigation 时才发现 —— 原先这个版本号从未被任何模块依赖过，所以一直没暴露）

hilt = "2.60.1"
# 注意：hilt-navigation-compose 1.4.0 要求 minCompileSdk=37，1.3.0 只要 35
hiltNavigationCompose = "1.3.0"
room = "2.8.5"
datastore = "1.2.1"
media3 = "1.11.1"
work = "2.11.2"
securityCrypto = "1.1.0"

okhttp = "4.12.0"
retrofit = "3.0.0"
kotlinxSerialization = "1.11.0"
# 注意：coil 3.6.x 要求 minCompileSdk=37，3.5.0 只要 36
coil = "3.5.0"
jaudiotagger = "3.0.1"

# 协程：文档 02 §7 的线程模型依赖它。必须显式固定版本 ——
# 否则 androidTest 会用它自己的版本编译、却运行在 APK 里由传递依赖带入的旧版本上，
# 表现为运行期 NoSuchMethodError。
kotlinxCoroutines = "1.11.0"

# 测试（文档 11 §8：JUnit + Turbine + MockK；Room 不变量测试走 androidTest）
junit = "4.13.2"
turbine = "1.2.1"
mockk = "1.14.11"
truth = "1.4.5"
androidxTestExtJunit = "1.3.0"
androidxTest = "1.7.0"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }

androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
# 行内图标（多选圈的取消、批量条动作）。BOM 管版本；只用 core 集（Default.*），
# 不用 extended（体积大且本项目用不到那么多图标）。
androidx-compose-material-icons-core = { module = "androidx.compose.material:material-icons-core" }
# Compose UI 测试（09 §8 / 11 §8.3）：junit4 规则 + 测试用空 Activity（ui-test-manifest 走 debugImplementation）
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }

androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
androidx-work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
androidx-security-crypto = { module = "androidx.security:security-crypto", version.ref = "securityCrypto" }

androidx-media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
androidx-media3-session = { module = "androidx.media3:media3-session", version.ref = "media3" }

hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-compiler", version.ref = "hilt" }
androidx-hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "hiltNavigationCompose" }

okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-logging = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }
# 传统 artifact（非 mockwebserver3）：API 与 P1 计划里的 server.url() / MockResponse().setResponseCode() 一致
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp" }
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofit-converter-kotlinx-serialization = { module = "com.squareup.retrofit2:converter-kotlinx-serialization", version.ref = "retrofit" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }

coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
jaudiotagger = { module = "net.jthink:jaudiotagger", version.ref = "jaudiotagger" }

# 测试
junit = { module = "junit:junit", version.ref = "junit" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
mockk-android = { module = "io.mockk:mockk-android", version.ref = "mockk" }
truth = { module = "com.google.truth:truth", version.ref = "truth" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTest" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTest" }
androidx-room-testing = { module = "androidx.room:room-testing", version.ref = "room" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
